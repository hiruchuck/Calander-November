<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>November Publishing Calendar</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b2430;--muted:#6b7686;--line:#dde2e8;--reel:#c2410c;--reelbg:#fff1e8;--photo:#1d4ed8;--photobg:#e8f0ff;--done:#15803d;--accent:#0f766e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--text:#e8edf3;--muted:#93a0b0;--line:#2b3644;--reel:#fb923c;--reelbg:#33220f;--photo:#7aa7ff;--photobg:#16233d;--done:#4ade80;--accent:#2dd4bf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--text:#e8edf3;--muted:#93a0b0;--line:#2b3644;--reel:#fb923c;--reelbg:#33220f;--photo:#7aa7ff;--photobg:#16233d;--done:#4ade80;--accent:#2dd4bf;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;line-height:1.35}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:18px;color:var(--text)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
button{font:inherit;font-size:13px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.scroll{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;min-width:910px}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cell.empty{background:transparent;border:1px dashed var(--line);opacity:.5}
.cell.today{outline:2px solid var(--accent)}
.d{font-size:12px;color:var(--muted);font-weight:600}
.item{display:flex;gap:6px;align-items:flex-start;border-radius:8px;padding:6px;cursor:pointer;flex:1}
.item.reel{background:var(--reelbg);border-left:4px solid var(--reel)}
.item.photo{background:var(--photobg);border-left:4px solid var(--photo)}
.item input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--done);flex:none;cursor:pointer}
.tag{font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.reel .tag{color:var(--reel)}.photo .tag{color:var(--photo)}
.t{font-size:13px;font-weight:600;word-break:break-word}
.item.done{opacity:.6}
.item.done .t{text-decoration:line-through}
.item.done .tag::after{content:" ✓";color:var(--done)}
.hide{display:none!important}
.leg{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>November 2026 · Publishing calendar</h1>
<div class="sub">25 posts · 10 Reels (Mon, Fri + one Wed) · 15 Photo posts. Tick each post once it’s published.</div>
<div class="stats">
<div class="stat"><b id="sAll">0 / 25</b>Total done</div>
<div class="stat"><b id="sReel">0 / 10</b>Reels</div>
<div class="stat"><b id="sPhoto">0 / 15</b>Photo posts</div>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="ctl">
<button data-f="all" class="on">All</button>
<button data-f="reel">Reels</button>
<button data-f="photo">Photos</button>
<button data-f="todo">Pending</button>
<button id="reset" style="margin-left:auto">Reset ticks</button>
</div>
<div class="scroll"><div class="grid" id="grid"></div></div>
<div class="leg">Orange = Reel · Blue = Photo post · Ticks are saved in this browser.</div>
</div>
<script>
const P=[
[2,'R',1,'Dvora Fleet'],[3,'P',1,'Ship Feature 01'],[4,'R',2,'Lighthouse'],[5,'P',2,'Ship Feature 02'],
[6,'R',3,'Training'],[7,'P',3,'Ship Feature 03'],[8,'P',4,'Dvora Feature 01'],[9,'R',4,'Harshitha'],
[10,'P',5,'Ship Feature 04'],[11,'P',6,'Dvora Feature 02'],[12,'P',7,'Marine'],[13,'R',5,'Horses'],
[14,'P',8,'SBS Feature 01'],[15,'P',9,'Women in the Navy'],[16,'R',6,'Diving'],[17,'P',10,'BOD'],
[18,'P',11,'Diving'],[19,'P',12,'SBS Feature 02'],[20,'R',7,'Marines'],[21,'P',13,'Four-Tile Image'],
[22,'P',14,'Ship Feature 05'],[23,'R',8,'Beauty of the East'],[24,'P',15,'Month in Rescue'],
[27,'R',9,'NMA'],[30,'R',10,'Beyond the Horizon – Women’s Empowerment']];
const KEY='nov-cal-done';
let done=new Set();
try{const v=localStorage.getItem(KEY);if(v)done=new Set(JSON.parse(v))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}}
const byDay={};P.forEach(p=>byDay[p[0]]=p);
const g=document.getElementById('grid');
['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(n=>{const d=document.createElement('div');d.className='dow';d.textContent=n;g.appendChild(d)});
const now=new Date();const todayN=(now.getFullYear()===2026&&now.getMonth()===10)?now.getDate():-1;
for(let i=0;i<6;i++){const c=document.createElement('div');c.className='cell empty';g.appendChild(c)}
for(let day=1;day<=30;day++){
 const c=document.createElement('div');c.className='cell'+(day===todayN?' today':'');
 const d=document.createElement('div');d.className='d';d.textContent=day;c.appendChild(d);
 const p=byDay[day];
 if(p){
  const id=(p[1]==='R'?'reel':'photo')+p[2];
  const lab=document.createElement('label');
  lab.className='item '+(p[1]==='R'?'reel':'photo');lab.dataset.id=id;lab.dataset.type=p[1]==='R'?'reel':'photo';
  const num=String(p[2]).padStart(2,'0');
  lab.innerHTML='<input type="checkbox"><div><div class="tag">'+(p[1]==='R'?'Reel ':'Photo ')+num+'</div><div class="t"></div></div>';
  lab.querySelector('.t').textContent=p[3];
  const cb=lab.querySelector('input');
  cb.checked=done.has(id);
  cb.addEventListener('change',()=>{cb.checked?done.add(id):done.delete(id);save();render()});
  c.appendChild(lab);
 }
 g.appendChild(c);
}
let filter='all';
function render(){
 let r=0,ph=0;
 document.querySelectorAll('.item').forEach(el=>{
  const isDone=done.has(el.dataset.id);
  el.classList.toggle('done',isDone);
  el.querySelector('input').checked=isDone;
  if(isDone){el.dataset.type==='reel'?r++:ph++}
  const hide=filter==='reel'&&el.dataset.type!=='reel'||filter==='photo'&&el.dataset.type!=='photo'||filter==='todo'&&isDone;
  el.classList.toggle('hide',hide);
 });
 document.getElementById('sAll').textContent=(r+ph)+' / 25';
 document.getElementById('sReel').textContent=r+' / 10';
 document.getElementById('sPhoto').textContent=ph+' / 15';
 document.getElementById('bar').style.width=((r+ph)/25*100)+'%';
}
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{
 filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));render()}));
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Clear all ticks?')){done.clear();save();render()}});
render();
</script>
</body>
</html>
